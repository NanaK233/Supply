name: Daily restock digest

# Sends the restock digest once a day via WhatsApp (CallMeBot).
# 04:00 UTC = 08:00 Gulf Standard Time (UAE). Adjust the cron if your timezone
# changes. GitHub may delay scheduled runs by a few minutes under load.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:      # lets you trigger a test run manually from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo (includes restock.db)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send the digest
        env:
          RESTOCK_CHANNELS: whatsapp
          RESTOCK_WHATSAPP_PROVIDER: callmebot
          RESTOCK_CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          RESTOCK_CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python notify.py
